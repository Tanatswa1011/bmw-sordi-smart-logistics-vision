classes:
  - pallet
  - stillage
  - forklift
  - dolly

seed: 42
max_images: 1200
split_fractions:
  train: 0.70
  val: 0.15
  test: 0.15

low_confidence_threshold: 0.40
iou_match_threshold: 0.50
smoke_image_count: 20

kaggle_dataset: sordi-ai/industrial-scene-01-dataset
# Resolved under the user home unless SORDI_CACHE is set.
cache_dir: ~/sordi-cache
scene_split: DR-1
